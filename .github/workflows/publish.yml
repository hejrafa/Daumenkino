name: Sync Letterboxd and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daumenkino-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INSTAGRAM_ENABLED: ${{ secrets.INSTAGRAM_TOKEN != '' }}
    outputs:
      instagram: ${{ steps.instagram.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test feed parsing and rendering
        run: python -m unittest discover -s tests -v
      - name: Test hover flipbook behavior
        run: node --test tests/flipbook.test.cjs
      - name: Update reviews
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: python scripts/sync.py
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build.py
      # Instagram images ship with the site, so Meta can fetch them once it is deployed.
      - name: Pick new reviews for Instagram
        id: instagram
        if: env.INSTAGRAM_ENABLED == 'true'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/instagram.py prepare "$RUNNER_TEMP/instagram.json"
      - name: Draw Instagram posts
        if: steps.instagram.outputs.count > 0
        run: |
          pip install playwright==1.64.1
          python scripts/instagram.py draw "$RUNNER_TEMP/instagram.json"
      - uses: actions/upload-artifact@v4
        if: env.INSTAGRAM_ENABLED == 'true'
        with:
          name: instagram
          path: ${{ runner.temp }}/instagram.json
      - name: Preserve feed archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/letterboxd.json data/top20.json
          if [ -f data/instagram.json ]; then git add data/instagram.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update Letterboxd snapshot [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  instagram:
    needs: [build, deploy]
    if: needs.build.outputs.instagram != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: instagram
          path: ${{ runner.temp }}
      - name: Post new reviews to Instagram
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_TOKEN }}
        run: python scripts/instagram.py publish "$RUNNER_TEMP/instagram.json"
      - name: Remember posted reviews
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/instagram.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Instagram posts [skip ci]'
            git pull --rebase origin main
            git push
          fi
